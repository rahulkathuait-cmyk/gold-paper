name: Gold paper trade

on:
  schedule:
    # 11:30 UTC = 17:00 IST. Entry 18:00 IST se (expiry 21:30 se 210 min pehle).
    - cron: "30 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Paper trade (aaj ki expiry tak)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          git config user.name  "gold-paper-bot"
          git config user.email "gold-paper-bot@users.noreply.github.com"

          save() {
            git add docs/state.json paper_state.json paper_trades.csv paper_log.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "paper update $(TZ=Asia/Kolkata date '+%d-%b %H:%M')"
              git pull -q --rebase || true
              git push -q || true
            fi
          }

          python gold_paper_trader.py --headless --export docs/state.json --export-every 30 --max-mins-left 210 --max-runtime 320 --entry-max 0.11 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 120
            save
          done
          wait $PID || true
          save
