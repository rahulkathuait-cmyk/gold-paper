name: Gold paper trade

on:
  schedule:
    # Run 1: 06:45 UTC = 12:15 IST (entry 13:30 IST se). Max 5.5 ghante chalta hai.
    - cron: "45 6 * * *"
    # Run 2: 12:15 UTC = 17:45 IST. Run 1 khatam hote hi shuru hoke expiry (21:30 IST) tak chalta hai.
    - cron: "15 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gold-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Paper trade
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          git config user.name  "gold-paper-bot"
          git config user.email "gold-paper-bot@users.noreply.github.com"
          git pull -q --rebase origin main || true

          save() {
            git add docs/state.json paper_state.json paper_trades.csv paper_log.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "paper update $(TZ=Asia/Kolkata date '+%d-%b %H:%M')"
              git pull -q --rebase || true
              git push -q || true
            fi
          }

          python gold_paper_trader.py --headless --export docs/state.json --export-every 30 --max-mins-left 480 --max-runtime 330 --band 80 --entry-min 0.05 --entry-max 0.15 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 120
            save
          done
          wait $PID || true
          save
